name: Real L1 Experiment

on:
  push:
    branches:
      - phase-10-run-real-l1-experiment
  workflow_dispatch:

jobs:
  run-l1-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Download RAS v2.1 L1 data
        run: python scripts/download_ras_l1.py --output data/ras2026-v2.1/l1

      - name: Run first real L1 experiment
        run: |
          python scripts/run_l1_experiment.py \
            --data data/ras2026-v2.1/l1 \
            --demands 12 \
            --test-fraction 0.3333333333333333 \
            --dataset-iterations 1 \
            --max-iterations 2 \
            --output artifacts/l1-first-experiment

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: l1-first-experiment
          path: artifacts/l1-first-experiment/
          if-no-files-found: error
